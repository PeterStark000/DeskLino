{{header}}

<main id="admin-panel" class="p-4 sm:p-6 lg:p-8 max-w-7xl mx-auto">
  <div class="bg-white rounded-2xl shadow-sm border border-gray-200">
    <div class="border-b border-gray-200">
      <h2 class="text-2xl font-bold text-gray-900 px-6 pt-6 pb-4">Painel Administrativo</h2>
      {{adminNav}}
    </div>

    <div class="p-6">
      <div class="flex flex-wrap items-center gap-3 mb-5">
        <input id="orders-search" type="text" placeholder="Buscar por cliente ou telefone..." class="w-full md:w-1/3 px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
        <input id="orders-client-id" type="number" min="1" placeholder="ID do Cliente (opcional)" class="md:w-64 px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
        <select id="orders-status-filter" class="w-full md:w-48 px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
          <option value="">Todos os status</option>
          <option>Pendente</option>
          <option>Em andamento</option>
          <option>Entregue</option>
          <option>Cancelado</option>
        </select>
        <button id="orders-search-btn" class="px-4 py-2.5 bg-blue-600 text-white text-sm font-medium rounded-lg hover:bg-blue-700 transition-colors">Buscar</button>
        <button id="orders-clear-btn" class="px-4 py-2.5 bg-gray-100 text-gray-700 text-sm font-medium rounded-lg hover:bg-gray-200 transition-colors">Limpar</button>
      </div>

      <div class="border border-gray-200 rounded-xl overflow-hidden">
        <div class="max-h-96 overflow-y-auto">
          <table class="min-w-full text-sm">
            <thead class="bg-gray-50 sticky top-0 z-[1]">
              <tr>
                <th class="text-left p-3 font-semibold text-gray-600 cursor-pointer hover:bg-gray-100" data-sort="id">ID <span class="sort-indicator"></span></th>
                <th class="text-left p-3 font-semibold text-gray-600 cursor-pointer hover:bg-gray-100" data-sort="client_name">Cliente <span class="sort-indicator"></span></th>
                <th class="text-left p-3 font-semibold text-gray-600 cursor-pointer hover:bg-gray-100" data-sort="phone">Telefone <span class="sort-indicator"></span></th>
                <th class="text-left p-3 font-semibold text-gray-600 cursor-pointer hover:bg-gray-100" data-sort="status">Status <span class="sort-indicator"></span></th>
                <th class="text-left p-3 font-semibold text-gray-600 cursor-pointer hover:bg-gray-100" data-sort="payment_method">Pagamento <span class="sort-indicator"></span></th>
                <th class="text-left p-3 font-semibold text-gray-600 cursor-pointer hover:bg-gray-100" data-sort="valor_total">Valor Total <span class="sort-indicator"></span></th>
                <th class="text-left p-3 font-semibold text-gray-600 cursor-pointer hover:bg-gray-100" data-sort="created_at">Data <span class="sort-indicator"></span></th>
                <th class="text-left p-3 font-semibold text-gray-600">Ações</th>
              </tr>
            </thead>
            <tbody id="admin-orders-body" class="divide-y divide-gray-100"></tbody>
          </table>
        </div>
        <div class="p-3 flex items-center justify-between bg-gray-50 border-t border-gray-200">
          <div id="admin-orders-summary" class="text-xs text-gray-500"></div>
          <div class="flex gap-2">
            <button id="orders-page-prev" class="px-3 py-1.5 text-sm border border-gray-300 rounded-lg hover:bg-gray-100 transition-colors">Anterior</button>
            <button id="orders-page-next" class="px-3 py-1.5 text-sm border border-gray-300 rounded-lg hover:bg-gray-100 transition-colors">Próxima</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<dialog id="order-details-modal" class="rounded-xl shadow-2xl p-0 max-w-2xl w-full border border-gray-200">
  <div class="bg-white rounded-xl">
    <div class="flex justify-between items-center border-b border-gray-200 px-6 py-4">
      <h3 class="text-xl font-semibold text-gray-900">Detalhes do Pedido</h3>
      <button onclick="this.closest('dialog').close()" class="text-gray-400 hover:text-gray-600 text-2xl leading-none">&times;</button>
    </div>
    <div id="order-details-body" class="p-6">
      <!-- Conteúdo dinâmico será inserido aqui -->
    </div>
    <div class="border-t border-gray-200 px-6 py-4 flex justify-between items-center">
      <button id="btn-corrigir-valor" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-semibold hidden transition-colors">Corrigir valor total</button>
      <button onclick="this.closest('dialog').close()" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-colors">Fechar</button>
    </div>
  </div>
</dialog>

<script type="module" src="/static/scripts/modules/admin_pedidos.js"></script>
