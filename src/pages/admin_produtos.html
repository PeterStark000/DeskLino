{{header}}

<main id="admin-panel" class="p-4 sm:p-6 lg:p-8 max-w-7xl mx-auto">
  <div class="bg-white rounded-2xl shadow-sm border border-gray-200">
    <div class="border-b border-gray-200">
      <h2 class="text-2xl font-bold text-gray-900 px-6 pt-6 pb-4">Painel Administrativo</h2>
      {{adminNav}}
    </div>

    <div class="p-6">
      <div class="flex flex-wrap items-center gap-3 mb-5">
        <input id="product-search" type="text" placeholder="Buscar por nome..." class="w-full md:w-1/3 px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
        <button id="product-search-btn" class="px-4 py-2.5 bg-blue-600 text-white text-sm font-medium rounded-lg hover:bg-blue-700 transition-colors">Buscar</button>
        <button id="product-clear-btn" class="px-4 py-2.5 bg-gray-100 text-gray-700 text-sm font-medium rounded-lg hover:bg-gray-200 transition-colors">Limpar</button>
        <button id="product-add-btn" class="ml-auto px-4 py-2.5 bg-green-600 text-white text-sm font-medium rounded-lg hover:bg-green-700 transition-colors">+ Adicionar Produto</button>
      </div>

      <div class="border border-gray-200 rounded-xl overflow-hidden">
        <div class="max-h-96 overflow-y-auto">
          <table class="min-w-full text-sm">
            <thead class="bg-gray-50 sticky top-0 z-[1]">
              <tr>
                <th class="text-left p-3 font-semibold text-gray-600 cursor-pointer hover:bg-gray-100" data-sort="id">ID <span class="sort-indicator"></span></th>
                <th class="text-left p-3 font-semibold text-gray-600 cursor-pointer hover:bg-gray-100" data-sort="name">Nome <span class="sort-indicator"></span></th>
                <th class="text-left p-3 font-semibold text-gray-600 cursor-pointer hover:bg-gray-100" data-sort="price">Valor <span class="sort-indicator"></span></th>
                <th class="text-left p-3 font-semibold text-gray-600 cursor-pointer hover:bg-gray-100" data-sort="stock">Estoque <span class="sort-indicator"></span></th>
                <th class="text-left p-3 font-semibold text-gray-600 cursor-pointer hover:bg-gray-100" data-sort="available">Disponível <span class="sort-indicator"></span></th>
                <th class="text-left p-3 font-semibold text-gray-600 cursor-pointer hover:bg-gray-100" data-sort="expiry_date">Validade <span class="sort-indicator"></span></th>
                <th class="text-left p-3 font-semibold text-gray-600">Ações</th>
              </tr>
            </thead>
            <tbody id="admin-products-body" class="divide-y divide-gray-100"></tbody>
          </table>
        </div>
        <div class="p-3 flex items-center justify-between bg-gray-50 border-t border-gray-200">
          <div id="admin-products-summary" class="text-xs text-gray-500"></div>
          <div class="flex gap-2">
            <button id="products-page-prev" class="px-3 py-1.5 text-sm border border-gray-300 rounded-lg hover:bg-gray-100 transition-colors">Anterior</button>
            <button id="products-page-next" class="px-3 py-1.5 text-sm border border-gray-300 rounded-lg hover:bg-gray-100 transition-colors">Próxima</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<!-- Modal Adicionar/Editar Produto -->
<dialog id="product-modal" class="rounded-xl w-full max-w-md p-0 shadow-2xl border border-gray-200">
  <div class="p-6">
    <h3 id="product-modal-title" class="text-lg font-semibold text-gray-900 mb-4">Produto</h3>
    <div class="space-y-3">
      <div>
        <label for="prod-nome" class="block text-sm font-medium text-gray-700 mb-1">Nome</label>
        <input id="prod-nome" type="text" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
      </div>
      <div>
        <label for="prod-descricao" class="block text-sm font-medium text-gray-700 mb-1">Descrição</label>
        <textarea id="prod-descricao" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"></textarea>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label for="prod-valor" class="block text-sm font-medium text-gray-700 mb-1">Valor (R$)</label>
          <input id="prod-valor" type="number" step="0.01" min="0" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
        </div>
        <div>
          <label for="prod-estoque" class="block text-sm font-medium text-gray-700 mb-1">Estoque</label>
          <input id="prod-estoque" type="number" step="1" min="0" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
        </div>
      </div>
      <div>
        <label for="prod-validade" class="block text-sm font-medium text-gray-700 mb-1">Data de Validade <span class="text-gray-400 font-normal">(opcional)</span></label>
        <input id="prod-validade" type="date" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
        <p id="prod-validade-warn" class="hidden mt-1 text-xs text-red-600">⚠️ Este produto está vencido — será marcado como indisponível automaticamente.</p>
      </div>
      <div class="flex items-center gap-2">
        <input id="prod-disponivel" type="checkbox" class="rounded" />
        <label for="prod-disponivel" class="text-sm text-gray-700">Disponível para venda</label>
      </div>
    </div>
    <div class="mt-6 flex justify-end gap-2">
      <button id="prod-cancel" class="px-4 py-2 text-sm border border-gray-300 rounded-lg hover:bg-gray-100 transition-colors">Cancelar</button>
      <button id="prod-save" class="px-4 py-2 text-sm bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">Salvar</button>
    </div>
  </div>
</dialog>

<script type="module" src="/static/scripts/modules/admin_produtos.js"></script>
