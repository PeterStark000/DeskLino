{{header}}

<main id="admin-panel" class="p-4 sm:p-6 lg:p-8 max-w-7xl mx-auto">
  <div class="bg-white rounded-2xl shadow-sm border border-gray-200">
    <div class="border-b border-gray-200">
      <h2 class="text-2xl font-bold text-gray-900 px-6 pt-6 pb-4">Painel Administrativo</h2>
      {{adminNav}}
    </div>
    <div class="p-6">
      <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3 mb-5">
        <input id="client-search-admin" type="text" placeholder="Buscar por nome ou email..." class="flex-1 px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
        <div class="flex gap-2">
          <button id="client-search-btn" class="px-4 py-2.5 bg-blue-600 text-white text-sm font-medium rounded-lg hover:bg-blue-700 transition-colors">Buscar</button>
          <button id="client-clear-btn" class="px-4 py-2.5 bg-gray-100 text-gray-700 text-sm font-medium rounded-lg hover:bg-gray-200 transition-colors">Limpar</button>
        </div>
      </div>
      <div class="border border-gray-200 rounded-xl overflow-hidden">
        <div class="max-h-96 overflow-y-auto">
          <table class="min-w-full text-sm">
            <thead class="bg-gray-50 sticky top-0 z-[1]">
              <tr>
                <th class="text-left p-3 font-semibold text-gray-600 cursor-pointer hover:bg-gray-100" data-sort="id">ID <span class="sort-indicator"></span></th>
                <th class="text-left p-3 font-semibold text-gray-600 cursor-pointer hover:bg-gray-100" data-sort="name">Nome <span class="sort-indicator"></span></th>
                <th class="text-left p-3 font-semibold text-gray-600 cursor-pointer hover:bg-gray-100" data-sort="phone">Telefone <span class="sort-indicator"></span></th>
                <th class="text-left p-3 font-semibold text-gray-600 cursor-pointer hover:bg-gray-100" data-sort="email">Email <span class="sort-indicator"></span></th>
                <th class="text-left p-3 font-semibold text-gray-600 cursor-pointer hover:bg-gray-100" data-sort="tipo_cliente">Tipo <span class="sort-indicator"></span></th>
                <th class="text-left p-3 font-semibold text-gray-600">Ações</th>
              </tr>
            </thead>
            <tbody id="admin-clientes-body" class="divide-y divide-gray-100"></tbody>
          </table>
        </div>
        <div class="p-3 flex items-center justify-between bg-gray-50 border-t border-gray-200">
          <div id="admin-clientes-summary" class="text-xs text-gray-500"></div>
          <div class="flex gap-2">
            <button id="admin-page-prev" class="px-3 py-1.5 text-sm border border-gray-300 rounded-lg hover:bg-gray-100 transition-colors">Anterior</button>
            <button id="admin-page-next" class="px-3 py-1.5 text-sm border border-gray-300 rounded-lg hover:bg-gray-100 transition-colors">Próxima</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <dialog id="edit-client-dialog" class="rounded-xl p-0 w-full max-w-2xl shadow-2xl border border-gray-200">
    <div class="p-6">
      <h2 class="text-lg font-semibold mb-4 text-gray-900">Editar Cliente</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <input type="text" id="edit-name" placeholder="Nome" class="px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
        <input type="email" id="edit-email" placeholder="Email" class="px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
        <select id="edit-tipo" class="px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
          <option value="PF">Pessoa Física</option>
          <option value="PJ">Pessoa Jurídica</option>
        </select>
        <input type="text" id="edit-doc" placeholder="CPF/CNPJ" class="px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
        <textarea id="edit-notes" rows="3" placeholder="Observações" class="px-3 py-2 border border-gray-300 rounded-lg md:col-span-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500"></textarea>
      </div>

      <div class="mt-6">
        <div class="flex items-center justify-between mb-2">
          <h3 class="text-base font-semibold text-gray-900">Endereços</h3>
          <button id="addr-add-toggle" class="px-3 py-1.5 text-sm rounded-lg bg-green-600 text-white hover:bg-green-700 transition-colors">Adicionar Endereço</button>
        </div>
        <div id="addresses-list" class="space-y-2"></div>

        <div id="addr-form" class="hidden mt-3 p-4 border border-gray-200 rounded-xl bg-gray-50">
          <div class="grid grid-cols-1 md:grid-cols-6 gap-2">
            <input id="addr-nome" class="px-2 py-2 border border-gray-300 rounded-lg md:col-span-2" placeholder="Apelido (ex: Casa)" />
            <input id="addr-logradouro" class="px-2 py-2 border border-gray-300 rounded-lg md:col-span-2" placeholder="Logradouro" />
            <input id="addr-numero" class="px-2 py-2 border border-gray-300 rounded-lg" placeholder="Número" />
            <input id="addr-complemento" class="px-2 py-2 border border-gray-300 rounded-lg" placeholder="Complemento" />
            <input id="addr-bairro" class="px-2 py-2 border border-gray-300 rounded-lg md:col-span-2" placeholder="Bairro" />
            <input id="addr-ref" class="px-2 py-2 border border-gray-300 rounded-lg md:col-span-3" placeholder="Ponto de Referência" />
            <label class="flex items-center gap-2 md:col-span-1 text-sm text-gray-700"><input type="checkbox" id="addr-principal" class="rounded" /> Principal</label>
          </div>
          <div class="mt-3 flex justify-end gap-2">
            <button id="addr-cancel" class="px-3 py-2 text-sm border border-gray-300 rounded-lg hover:bg-gray-100 transition-colors">Cancelar</button>
            <button id="addr-save" class="px-3 py-2 text-sm bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">Salvar Endereço</button>
          </div>
        </div>
      </div>

      <div class="mt-6 flex justify-end gap-2">
        <button id="edit-cancel" class="px-4 py-2 text-sm border border-gray-300 rounded-lg hover:bg-gray-100 transition-colors">Fechar</button>
        <button id="edit-save" class="px-4 py-2 text-sm bg-green-600 text-white rounded-lg hover:bg-green-700 transition-colors">Salvar Alterações</button>
      </div>
    </div>
  </dialog>
</main>

<script type="module" src="/static/scripts/modules/admin_clientes.js"></script>
