<header class="bg-white/90 backdrop-blur-sm shadow-sm border-b border-gray-200 sticky top-0 z-10">

    <div class="flex justify-between items-center h-16">
      <div class="flex-shrink-0">
        <span class="text-xl font-bold text-blue-600 tracking-tight">Picolino Gás</span>
      </div>
      <div class="flex items-center gap-4">
        <button id="admin-toggle-button" class="hidden px-3 py-2 rounded-lg text-sm font-medium bg-yellow-500 text-white hover:bg-yellow-600 transition-colors shadow-sm">Painel Admin</button>
        <span class="hidden sm:inline text-sm text-gray-600">
          Usuário: <strong id="atendente-nome" class="font-semibold text-gray-800"></strong>
          <span class="ml-1 px-2 py-0.5 rounded-full bg-blue-50 text-blue-700 text-xs font-medium" id="user-role-display"></span>
        </span>
        <button id="logout-button" class="text-sm font-medium text-gray-500 hover:text-blue-600 transition-colors">Sair</button>
      </div>
    </div>
  </div>
</header>
