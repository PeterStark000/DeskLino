{{header}}

<main id="admin-panel" class="p-4 sm:p-6 lg:p-8 max-w-7xl mx-auto">
  <div class="bg-white rounded-2xl shadow-sm border border-gray-200">
    <div class="border-b border-gray-200">
      <h2 class="text-2xl font-bold text-gray-900 px-6 pt-6 pb-4">Painel Administrativo</h2>
      {{adminNav}}
    </div>

    <div class="p-6">
      <h3 class="text-xl font-semibold mb-1 text-gray-900">Histórico de Atendimentos</h3>
      <p class="mb-6 text-gray-500 text-sm">Registros de todos os atendimentos realizados no sistema.</p>
      <div class="overflow-x-auto rounded-xl border border-gray-200">
        <table class="min-w-full divide-y divide-gray-200">
          <thead class="bg-gray-50">
            <tr>
              <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Data/Hora</th>
              <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Atendente</th>
              <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Cliente</th>
              <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Telefone</th>
              <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Ações</th>
            </tr>
          </thead>
          <tbody class="bg-white divide-y divide-gray-100" id="logs-table-body"></tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<dialog id="order-modal" class="rounded-xl p-0 w-full max-w-md shadow-2xl border border-gray-200">
  <div class="p-6 bg-white rounded-xl">
    <div class="flex items-center justify-between mb-4">
      <h3 class="text-lg font-semibold text-gray-900">Detalhes do Pedido</h3>
      <button id="order-modal-close" class="text-gray-400 hover:text-gray-600 transition-colors">Fechar</button>
    </div>
    <div id="order-modal-body" class="space-y-4">
      <p class="text-sm text-gray-600">Carregando...</p>
    </div>
  </div>
</dialog>
