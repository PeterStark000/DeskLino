<div id="login-screen" class="flex items-center justify-center min-h-screen bg-gradient-to-br from-blue-50 via-white to-gray-100 px-4">
  <div class="w-full max-w-md p-8 space-y-6 bg-white rounded-2xl shadow-xl border border-gray-100">
    <div class="flex justify-center">
      <div class="p-4 rounded-full bg-blue-50">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-12 h-12 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17.657 18.657A8 8 0 016.343 7.343m11.314 11.314a8 8 0 00-11.314-11.314m11.314 11.314L22 22M12 20.364V19.273c0-1.357.6-2.6 1.5-3.436A5 5 0 106.5 12c0 .35.038.69.108 1.02" />
        </svg>
      </div>
    </div>
    <div class="text-center space-y-1">
      <h2 class="text-3xl font-bold text-gray-900">Picolino Gás</h2>
      <p class="text-gray-500 text-sm">Sistema de Suporte ao Atendimento</p>
    </div>

    <form id="login-form" class="space-y-5">
      <div>
        <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Usuário</label>
        <input id="username" name="username" type="text" required value="admin.user"
          class="block w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors" />
      </div>
      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
        <input id="password" name="password" type="password" required value="admin"
          class="block w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors" />
        <p class="mt-2 text-xs text-gray-500">Dica: Use a senha "admin" para acesso de administrador.</p>
      </div>
      <button type="submit"
        class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-md text-sm font-semibold text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors">
        Entrar
      </button>
    </form>
  </div>
</div>
