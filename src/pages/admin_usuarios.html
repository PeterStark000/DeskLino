{{header}}

<main id="admin-panel" class="p-4 sm:p-6 lg:p-8 max-w-7xl mx-auto">
  <div class="bg-white rounded-2xl shadow-sm border border-gray-200">
    <div class="border-b border-gray-200">
      <h2 class="text-2xl font-bold text-gray-900 px-6 pt-6 pb-4">Painel Administrativo</h2>
      {{adminNav}}
    </div>
    <div class="p-6">
      <h3 class="text-xl font-semibold mb-1 text-gray-900">Controle de Níveis de Acesso</h3>
      <p class="mb-6 text-gray-500 text-sm">Altere o nível de privilégio dos usuários do sistema.</p>
      <div class="overflow-x-auto rounded-xl border border-gray-200">
        <table class="min-w-full divide-y divide-gray-200">
          <thead class="bg-gray-50">
            <tr>
              <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Usuário</th>
              <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Nome Completo</th>
              <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Nível de Acesso</th>
              <th class="px-6 py-3 text-right text-xs font-semibold text-gray-500 uppercase tracking-wider">Ação</th>
            </tr>
          </thead>
          <tbody class="bg-white divide-y divide-gray-100" id="users-table-body">
          </tbody>
        </table>
      </div>
    </div>
  </div>
</main>
