{{header}}

<main id="admin-panel" class="p-4 sm:p-6 lg:p-8 max-w-7xl mx-auto">
  <div class="bg-white rounded-2xl shadow-sm border border-gray-200">
    <div class="border-b border-gray-200">
      <h2 class="text-2xl font-bold text-gray-900 px-6 pt-6 pb-4">Painel Administrativo</h2>
      {{adminNav}}
    </div>

    <div class="p-6">
      <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3 mb-5">
        <input id="phone-search" type="text" placeholder="Buscar por número ou nome do cliente..." class="flex-1 px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
        <div class="flex gap-2">
          <button id="phone-search-btn" class="px-4 py-2.5 bg-blue-600 text-white text-sm font-medium rounded-lg hover:bg-blue-700 transition-colors">Buscar</button>
          <button id="phone-clear-btn" class="px-4 py-2.5 bg-gray-100 text-gray-700 text-sm font-medium rounded-lg hover:bg-gray-200 transition-colors">Limpar</button>
        </div>
      </div>

      <div class="border border-gray-200 rounded-xl overflow-hidden">
        <div class="max-h-96 overflow-y-auto">
          <table class="min-w-full text-sm">
            <thead class="bg-gray-50 sticky top-0 z-[1]">
              <tr>
                <th class="text-left p-3 font-semibold text-gray-600 cursor-pointer hover:bg-gray-100" data-sort="id">ID <span class="sort-indicator"></span></th>
                <th class="text-left p-3 font-semibold text-gray-600 cursor-pointer hover:bg-gray-100" data-sort="phone">Número <span class="sort-indicator"></span></th>
                <th class="text-left p-3 font-semibold text-gray-600 cursor-pointer hover:bg-gray-100" data-sort="client_name">Cliente <span class="sort-indicator"></span></th>
                <th class="text-left p-3 font-semibold text-gray-600">Ações</th>
              </tr>
            </thead>
            <tbody id="admin-phones-body" class="divide-y divide-gray-100"></tbody>
          </table>
        </div>
        <div class="p-3 flex items-center justify-between bg-gray-50 border-t border-gray-200">
          <div class="flex items-center gap-3">
            <button id="btn-open-add-phone" class="px-3 py-1.5 text-sm bg-green-600 text-white rounded-lg hover:bg-green-700 transition-colors">+ Adicionar telefone</button>
            <div id="admin-phones-summary" class="text-xs text-gray-500"></div>
          </div>
          <div class="flex gap-2">
            <button id="phones-page-prev" class="px-3 py-1.5 text-sm border border-gray-300 rounded-lg hover:bg-gray-100 transition-colors">Anterior</button>
            <button id="phones-page-next" class="px-3 py-1.5 text-sm border border-gray-300 rounded-lg hover:bg-gray-100 transition-colors">Próxima</button>
          </div>
        </div>
      </div>

      <!-- Modal Adicionar Telefone -->
      <dialog id="add-phone-modal" class="rounded-xl w-full max-w-md p-0 shadow-2xl border border-gray-200">
        <div class="p-6">
          <h3 class="text-lg font-semibold text-gray-900 mb-4">Adicionar Telefone</h3>
          <div class="space-y-3">
            <div>
              <label for="add-phone-modal-client" class="block text-sm font-medium text-gray-700 mb-1">ID do Cliente</label>
              <input id="add-phone-modal-client" type="number" min="1" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="Ex.: 123" />
            </div>
            <div>
              <label for="add-phone-modal-number" class="block text-sm font-medium text-gray-700 mb-1">Telefone</label>
              <input id="add-phone-modal-number" type="text" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="(00) 00000-0000" />
            </div>
          </div>
          <div class="mt-6 flex justify-end gap-2">
            <button id="add-phone-cancel" class="px-4 py-2 text-sm border border-gray-300 rounded-lg hover:bg-gray-100 transition-colors">Cancelar</button>
            <button id="add-phone-confirm" class="px-4 py-2 text-sm bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">Salvar</button>
          </div>
        </div>
      </dialog>

      <!-- Modal Editar Telefone -->
      <dialog id="edit-phone-modal" class="rounded-xl w-full max-w-md p-0 shadow-2xl border border-gray-200">
        <div class="p-6">
          <h3 class="text-lg font-semibold text-gray-900 mb-4">Editar Telefone</h3>
          <div class="space-y-3">
            <div>
              <label for="edit-phone-modal-number" class="block text-sm font-medium text-gray-700 mb-1">Novo Número</label>
              <input type="text" id="edit-phone-modal-number" class="w-full px-3 py-2.5 bg-white border border-gray-300 rounded-lg text-gray-900 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="(00) 00000-0000" />
            </div>
          </div>
          <div class="mt-6 flex justify-end gap-2">
            <button id="edit-phone-cancel" class="px-4 py-2 text-sm border border-gray-300 rounded-lg hover:bg-gray-100 transition-colors">Cancelar</button>
            <button id="edit-phone-confirm" class="px-4 py-2 text-sm bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">Salvar</button>
          </div>
        </div>
      </dialog>
    </div>
  </div>
</main>

<script type="module" src="/static/scripts/modules/admin_telefones.js"></script>
